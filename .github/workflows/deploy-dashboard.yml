name: Deploy MobileShield Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "data/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Generate analyzed findings
        run: python scripts/analyze_findings.py

      - name: Validate remediation controls
        run: python scripts/validate_remediation.py

      - name: Generate dashboard data
        run: |
          python scripts/generate_dashboard_data.py \
            --assessment-date 2026-09-09

      - name: Validate dashboard assets
        run: |
          python -m json.tool \
            dashboard/data.json \
            >/dev/null

          test -s dashboard/index.html
          test -s dashboard/styles.css
          test -s dashboard/app.js
          test -s dashboard/data.json

          grep -q \
            'id="findings-body"' \
            dashboard/index.html

          grep -q \
            'initializeDashboard' \
            dashboard/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dashboard

  deploy:
    name: Deploy Dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5